[tab SETUP]
# What the pads do: VOICES play the seven voices (General MIDI drum notes,
# or the pads PAD LEARN learned); STEPS makes them the 16 step keys, held
# while a pad is: hold one and turn a knob to lock the step. PAD LEARN learns
# the mode's pads in order; CLEAR PADS forgets them.
enum_h  cx=241 cy=200 sw=180 sh=80 label="PADS PLAY" key=pad_mode options=VOICES,STEPS
toggle  cx=790 cy=200 label="PAD LEARN" key=learn bw=300
button  cx=1110 cy=200 w=280 h=80 label="CLEAR PADS" key=pads_clear
readout cx=640 cy=300 w=1180 h=46 label="" key=pads_info tsize=19 tcolor=9be8ff
